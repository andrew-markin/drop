name: Build and Release

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Fail fast on tags that do not match the project version, before the builds
  check-version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Check tag matches project version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          PROJECT_VERSION="$(grep -oP 'project\(Drop VERSION \K[0-9.]+' Sources/CMakeLists.txt)"
          if [ "$TAG_VERSION" != "$PROJECT_VERSION" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match project version $PROJECT_VERSION"
            exit 1
          fi

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Web
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: Web/package-lock.json

      - run: npm ci
      - run: npx oxlint . && npx eslint .
      - run: npx prettier --check src e2e
      - run: npm test
      - run: npm run build

  # Both sides check their cryptography against these vectors, so they must be what the
  # independent generator makes
  vectors:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Generate protocol vectors
        run: |
          python3 -m venv /tmp/venv
          /tmp/venv/bin/pip install --quiet pynacl==1.5.0
          /tmp/venv/bin/python -I docs/vectors/generate.py
          git diff --exit-code docs/vectors

  build-linux:
    needs: check-version
    runs-on: ubuntu-latest
    timeout-minutes: 300 # Building Qt for a new builder image takes a while
    # A new push to main waits instead of cancelling, so a builder image that took hours is pushed
    concurrency:
      group: build-linux-${{ matrix.distro }}-${{ github.ref }}
      cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - distro: ubuntu
            script: ReleaseUbuntu.sh
            package: deb
          - distro: fedora
            script: ReleaseFedora.sh
            package: rpm
    steps:
      - uses: actions/checkout@v7

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Builder image is tagged with the Dockerfile hash, so it is rebuilt only when the Dockerfile changes
      - name: Prepare builder image
        env:
          DISTRO: ${{ matrix.distro }}
          PUSH_IMAGE: ${{ github.event_name != 'pull_request' }}
        run: |
          OWNER="${GITHUB_REPOSITORY_OWNER,,}"
          REMOTE_IMAGE="ghcr.io/$OWNER/drop-$DISTRO-builder:$(sha256sum "Dockerfile.$DISTRO" | cut -c1-16)"
          LOCAL_IMAGE="drop-$DISTRO-builder"

          if docker pull "$REMOTE_IMAGE"; then
            docker tag "$REMOTE_IMAGE" "$LOCAL_IMAGE"
            exit 0
          fi

          echo "Builder image $REMOTE_IMAGE not found, building..."

          # Building Qt needs more disk space than the runner has free by default
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /

          # Dockerfiles do not copy any files, so no build context is needed.
          # Official Qt download server is used instead of the default mirror meant for local builds.
          docker build --build-arg QT_MIRROR=https://download.qt.io -t "$LOCAL_IMAGE" - < "Dockerfile.$DISTRO"

          if [ "$PUSH_IMAGE" = "true" ]; then
            docker tag "$LOCAL_IMAGE" "$REMOTE_IMAGE"
            docker push "$REMOTE_IMAGE"
          fi

      # The application, its unit tests and the end-to-end tests of the web client against the
      # server, all with the same Qt and toolchain as the packages. npm needs a writable home.
      - name: Build and test
        run: |
          docker run --rm -u "$(id -u):$(id -g)" -e HOME=/tmp -v "$PWD:/workspace" -w /workspace \
                     "drop-${{ matrix.distro }}-builder" /bin/bash -ec '
            cmake -S Sources -B Builds/Tests -G Ninja -DCMAKE_PREFIX_PATH="$QT_PREFIX" -DDROP_BUILD_TESTS=ON
            cmake --build Builds/Tests --parallel
            ctest --test-dir Builds/Tests --output-on-failure --no-tests=error
          '

      - name: Build package
        run: ./${{ matrix.script }}

      - uses: actions/upload-artifact@v7
        with:
          name: package-${{ matrix.package }}
          path: Release/*.${{ matrix.package }}
          if-no-files-found: error

  build-windows:
    needs: check-version
    runs-on: windows-2022
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: Web/package-lock.json

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.11.2"
          host: windows
          target: desktop
          arch: win64_msvc2022_64
          # The official HTTP Server build depends on WebSockets, although the application does not use them
          modules: qthttpserver qtwebsockets
          cache: true
          # aqtinstall 3.3.0 (the latest release) can't install Qt 6.11+ on Windows, the fix is not released yet:
          # https://github.com/miurahr/aqtinstall/pull/1000. Return to the default when aqtinstall 3.4 is out.
          aqtsource: git+https://github.com/miurahr/aqtinstall.git@076e1659807d0b362a3ed684d54c2e9c775eb9c7

      # Linked statically, so the application needs no libsodium DLL next to it
      - name: Install libsodium
        shell: cmd
        run: vcpkg install libsodium:x64-windows-static-md

      - name: Build and test
        shell: cmd
        run: |
          cmake -S Sources -B Builds\Tests -G "Visual Studio 17 2022" -A x64 -DCMAKE_PREFIX_PATH="%QT_ROOT_DIR%" ^
                -DCMAKE_TOOLCHAIN_FILE="%VCPKG_INSTALLATION_ROOT%\scripts\buildsystems\vcpkg.cmake" ^
                -DVCPKG_TARGET_TRIPLET=x64-windows-static-md -DDROP_BUILD_TESTS=ON || exit /b 1
          cmake --build Builds\Tests --config Release --parallel || exit /b 1
          ctest --test-dir Builds\Tests -C Release --output-on-failure --no-tests=error && exit /b 0
          rem Test output doesn't reach ctest log on Windows, so detailed reports are written to files
          for %%T in (Builds\Tests\Tests\Release\Test*.exe) do (
            %%T -o Builds\Tests\%%~nT.txt,txt
            type Builds\Tests\%%~nT.txt
          )
          exit /b 1

      - name: Install NSIS if missing
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\NSIS\makensis.exe")) {
            choco install nsis -y --no-progress
          }

      - name: Build installer
        shell: cmd
        env:
          QT_PREFIX: ${{ env.QT_ROOT_DIR }}
        run: call ReleaseWindows.cmd

      - uses: actions/upload-artifact@v7
        with:
          name: package-windows
          path: Release/*.exe
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [web, vectors, build-linux, build-windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: package-*
          path: packages
          merge-multiple: true

      # Lets users verify downloads with "sha256sum -c SHA256SUMS --ignore-missing"
      - name: Calculate checksums
        working-directory: packages
        run: |
          sha256sum -- * > SHA256SUMS
          cat SHA256SUMS

      - name: Publish release
        uses: softprops/action-gh-release@v3
        with:
          name: Drop ${{ github.ref_name }}
          files: packages/*
          generate_release_notes: true
          draft: true # Published manually after review
